[project]
name = "self-learning-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.5.0",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.22",
